# iOS + Android apps (apps/mobile, Capacitor around apps/web). See docs/MOBILE-RELEASE.md.
#
# Every PR / push touching the apps: an unsigned Android debug APK, an Android emulator smoke test
# (install, launch, the app's page renders) and an iOS simulator build. All must stay green.
#
# Store builds run on a tag `mobile-v*` or "Run workflow" with release = true, and only when the
# signing secrets exist (otherwise those jobs are skipped):
#   Android → signed AAB → Google Play internal testing
#     secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD (optional),
#              PLAY_SERVICE_ACCOUNT_JSON, GOOGLE_SERVICES_JSON (Firebase, for push)
#     variables: ANDROID_KEY_ALIAS (default nordlys), PLAY_RELEASE_STATUS (default draft)
#   iOS → signed archive → App Store Connect / TestFlight
#     secrets: APP_STORE_CONNECT_API_KEY_P8, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID
#     variables: APPLE_TEAM_ID
# Shared variables: APP_ID (default no.salnikov.nordlys), ADMOB_APP_ID_ANDROID, ADMOB_APP_ID_IOS,
#   ADMOB_BANNER_ANDROID, ADMOB_BANNER_IOS (no ad unit = no ads in store builds).

name: Mobile

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    tags: ['mobile-v*']
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Also build signed store builds and upload them (Play internal testing / TestFlight)'
        type: boolean
        default: false

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_ID: ${{ vars.APP_ID || 'no.salnikov.nordlys' }}

jobs:
  config:
    name: Version and release switches
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.c.outputs.version }}
      build: ${{ steps.c.outputs.build }}
      android_release: ${{ steps.c.outputs.android_release }}
      ios_release: ${{ steps.c.outputs.ios_release }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        env:
          WANT_RELEASE: ${{ startsWith(github.ref, 'refs/tags/mobile-v') || inputs.release == true }}
          HAS_ANDROID: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
          HAS_IOS: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 != '' && secrets.APP_STORE_CONNECT_KEY_ID != '' && secrets.APP_STORE_CONNECT_ISSUER_ID != '' && vars.APPLE_TEAM_ID != '' }}
        run: |
          version="$(jq -r .version apps/mobile/package.json)"
          # Store build numbers must only go up: the workflow run number (+1000 headroom).
          build=$((GITHUB_RUN_NUMBER + 1000))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          a=false; i=false
          if [ "$WANT_RELEASE" = "true" ]; then
            if [ "$HAS_ANDROID" = "true" ]; then a=true; else echo "::notice::Android store build skipped: signing/Play secrets not set (docs/MOBILE-RELEASE.md)"; fi
            if [ "$HAS_IOS" = "true" ]; then i=true; else echo "::notice::iOS store build skipped: App Store Connect secrets not set (docs/MOBILE-RELEASE.md)"; fi
          fi
          echo "android_release=$a" >> "$GITHUB_OUTPUT"
          echo "ios_release=$i" >> "$GITHUB_OUTPUT"
          echo "Version $version ($build); android release: $a; ios release: $i"

  android-debug:
    name: Android debug APK
    needs: config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - name: Firebase config (optional, enables push)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/android/app/google-services.json
            echo "google-services.json written"
          fi
      - name: Build the web app for the native shell (test ads)
        run: pnpm --filter @nordlys/mobile build:web
        env:
          ADMOB_TESTING: 'true'
      - name: Capacitor sync
        run: pnpm --filter @nordlys/mobile exec cap sync android
      - name: Gradle assembleDebug
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace -PversionCode=${{ needs.config.outputs.build }} -PversionName=${{ needs.config.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  android-smoke:
    name: Android emulator smoke test
    needs: android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app-debug.apk
            adb shell am start -W -n "$APP_ID/.MainActivity"
            sleep 25
            adb exec-out screencap -p > smoke.png
            adb shell pidof "$APP_ID" || (echo "::error::app is not running"; adb logcat -d | tail -200; exit 1)
            adb logcat -d -s Capacitor:* Capacitor/Console:* chromium:* > smoke-logcat.txt || true
            if grep -qiE "FATAL EXCEPTION" smoke-logcat.txt; then echo "::error::crash in logcat"; cat smoke-logcat.txt; exit 1; fi
            grep -i "Capacitor" smoke-logcat.txt | head -40 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: |
            smoke.png
            smoke-logcat.txt
          retention-days: 14

  ios-debug:
    name: iOS simulator build
    needs: config
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web app for the native shell (test ads)
        run: pnpm --filter @nordlys/mobile build:web
        env:
          ADMOB_TESTING: 'true'
      - name: Capacitor sync
        run: pnpm --filter @nordlys/mobile exec cap sync ios
      - name: xcodebuild (simulator, unsigned)
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            MARKETING_VERSION=${{ needs.config.outputs.version }} CURRENT_PROJECT_VERSION=${{ needs.config.outputs.build }} \
            CODE_SIGNING_ALLOWED=NO build
      - name: Zip the .app
        run: cd apps/mobile/ios/App/build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/App-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: App-simulator.zip
          retention-days: 14

  android-release:
    name: Android store build (signed AAB → Play internal testing)
    needs: [config, android-debug]
    if: needs.config.outputs.android_release == 'true'
    runs-on: ubuntu-latest
    environment: store
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - name: Secrets to files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON not set: this build has no push notifications"
          fi
      - name: Build the web app for the native shell
        run: pnpm --filter @nordlys/mobile build:web
        env:
          NODE_ENV: production
          ADMOB_BANNER_ANDROID: ${{ vars.ADMOB_BANNER_ANDROID }}
      - name: Capacitor sync
        run: pnpm --filter @nordlys/mobile exec cap sync android
        env:
          NODE_ENV: production
      - name: Gradle bundleRelease
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || 'nordlys' }}
          ADMOB_APP_ID_ANDROID: ${{ vars.ADMOB_APP_ID_ANDROID }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace -PversionCode=${{ needs.config.outputs.build }} -PversionName=${{ needs.config.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Upload to Google Play (internal testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.APP_ID }}
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          releaseName: ${{ needs.config.outputs.version }} (${{ needs.config.outputs.build }})
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  ios-release:
    name: iOS store build (signed → TestFlight)
    needs: [config, ios-debug]
    if: needs.config.outputs.ios_release == 'true'
    runs-on: macos-latest
    environment: store
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web app for the native shell
        run: pnpm --filter @nordlys/mobile build:web
        env:
          NODE_ENV: production
          ADMOB_BANNER_IOS: ${{ vars.ADMOB_BANNER_IOS }}
      - name: Capacitor sync
        run: pnpm --filter @nordlys/mobile exec cap sync ios
        env:
          NODE_ENV: production
      - name: AdMob app ID
        if: vars.ADMOB_APP_ID_IOS != ''
        run: /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier ${{ vars.ADMOB_APP_ID_IOS }}" apps/mobile/ios/App/App/Info.plist
      - name: App Store Connect API key
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/asc.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ vars.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
      - name: Archive
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ vars.APPLE_TEAM_ID }}" CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_ID" \
            MARKETING_VERSION=${{ needs.config.outputs.version }} CURRENT_PROJECT_VERSION=${{ needs.config.outputs.build }} \
            archive
      - name: Export and upload to App Store Connect (TestFlight)
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"
