# Required GitHub secrets:
# - AZURE_CLIENT_ID: Microsoft Entra app/client ID with a GitHub OIDC federated credential.
# - AZURE_TENANT_ID: Microsoft Entra tenant ID.
# - AZURE_SUBSCRIPTION_ID: Azure subscription ID.
# - GHCR_PULL_TOKEN: Classic GitHub PAT with read:packages for the private GHCR image pull secret.
# - MET_USER_AGENT: Secure value for the Bicep metUserAgent parameter.
# - VAPID_PUBLIC_KEY: Secure value for the Bicep vapidPublicKey parameter.
# - VAPID_PRIVATE_KEY: Secure value for the Bicep vapidPrivateKey parameter.
# - VAPID_SUBJECT: Secure value for the Bicep vapidSubject parameter.
# Required GitHub variables:
# - AZURE_RESOURCE_GROUP: Target resource group for the resource-group scoped Bicep deployment.
# Optional GitHub variables:
# - LOCATION: Azure region; defaults to norwayeast.
# - NAME_PREFIX: Bicep namePrefix; defaults to nordlys.
# - CUSTOM_DOMAIN: comma-separated custom hostnames to keep bound after each deploy
#   (e.g. "nordlys.salnikov.no,nordlys.isainative.dev"). See docs/CUSTOM-DOMAIN.md.
# - CANONICAL_HOST: primary hostname (e.g. nordlys.salnikov.no). Together with LEGACY_HOSTS it
#   turns on 301 redirects from the old hostnames. Leave unset until the new domain works.
# - LEGACY_HOSTS: comma-separated old hostnames to redirect (e.g. nordlys.isainative.dev).
# - EMAIL_DOMAIN: sending domain for e-mail alerts (e.g. varsel.salnikov.no). Creates Azure
#   Communication Services Email + the domain; e-mail switches on by itself once the DNS records
#   are verified (checked on every deploy). See docs/INFRA.md.
# - EMAIL_REPLY_TO: optional Reply-To address for alert e-mails.
# - APNS_KEY_ID, APNS_TEAM_ID, APNS_BUNDLE_ID: iOS push (with the APNS_KEY_P8 secret); the team +
#   bundle ID also serve /.well-known/apple-app-site-association (universal links).
# - ANDROID_CERT_SHA256 (+ APP_ID): serves /.well-known/assetlinks.json (Android App Links).
# Optional GitHub secrets (native push in the mobile apps; see docs/MOBILE-RELEASE.md):
# - FCM_SERVICE_ACCOUNT_JSON: Firebase service account JSON (Android push via FCM HTTP v1).
# - APNS_KEY_P8: APNs auth key, the .p8 file contents (iOS push).

name: Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
      - 'scripts/**'
      - 'infra/analytics-dashboard.json'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-nordlys' }}
  LOCATION: ${{ vars.LOCATION || 'norwayeast' }}
  NAME_PREFIX: ${{ vars.NAME_PREFIX || 'nordlys' }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    name: Build image and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group
        run: az group create --name "$AZURE_RESOURCE_GROUP" --location "$LOCATION"

      - name: E-mail domain state
        # Creates nothing by itself: reads whether the ACS e-mail domain is verified, and asks
        # Azure to (re)check any record that is not verified yet. Verified = e-mail goes live.
        id: email
        if: vars.EMAIL_DOMAIN != ''
        env:
          EMAIL_DOMAIN: ${{ vars.EMAIL_DOMAIN }}
        run: |
          state="$(az provider show --namespace Microsoft.Communication --query registrationState -o tsv 2>/dev/null || true)"
          if [ "$state" != "Registered" ]; then
            az provider register --namespace Microsoft.Communication --wait \
              || echo "::warning::Could not register the Microsoft.Communication provider. Run once: az provider register --namespace Microsoft.Communication"
          fi
          verified=false
          svc="$(az resource list -g "$AZURE_RESOURCE_GROUP" --resource-type Microsoft.Communication/emailServices --query '[0].name' -o tsv)"
          if [ -n "$svc" ]; then
            sub="$(az account show --query id -o tsv)"
            url="https://management.azure.com/subscriptions/$sub/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.Communication/emailServices/$svc/domains/$EMAIL_DOMAIN"
            # Up to ~6 minutes: ask Azure to check each unverified record, then wait for the result,
            # so one run after the DNS records are added is enough to switch e-mail on.
            for attempt in $(seq 1 12); do
              states="$(az rest --method get --url "$url?api-version=2023-04-01" --query properties.verificationStates -o json 2>/dev/null || echo '{}')"
              verified=true
              pending=false
              for t in Domain SPF DKIM DKIM2; do
                s="$(echo "$states" | jq -r --arg t "$t" '.[$t].status // "NotStarted"')"
                echo "[$attempt] $EMAIL_DOMAIN $t: $s"
                [ "$s" = "Verified" ] && continue
                verified=false
                if [ "$s" = "VerificationRequested" ] || [ "$s" = "VerificationInProgress" ]; then
                  pending=true
                elif [ "$attempt" = "1" ]; then
                  if az rest --method post --url "$url/initiateVerification?api-version=2023-04-01" \
                    --body "{\"verificationType\":\"$t\"}" > /dev/null 2>&1; then
                    echo "Asked Azure to verify $t"
                    pending=true
                  else
                    echo "::notice::$EMAIL_DOMAIN $t could not be checked yet (DNS record missing?)"
                  fi
                fi
              done
              if [ "$verified" = "true" ] || [ "$pending" = "false" ]; then break; fi
              sleep 30
            done
          fi
          echo "E-mail domain verified: $verified"
          echo "verified=$verified" >> "$GITHUB_OUTPUT"

      - name: Deploy Azure infrastructure
        id: deploy
        env:
          CANONICAL_HOST: ${{ vars.CANONICAL_HOST }}
          LEGACY_HOSTS: ${{ vars.LEGACY_HOSTS }}
          EMAIL_DOMAIN: ${{ vars.EMAIL_DOMAIN }}
          EMAIL_VERIFIED: ${{ steps.email.outputs.verified }}
          EMAIL_REPLY_TO: ${{ vars.EMAIL_REPLY_TO }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
          APNS_BUNDLE_ID: ${{ vars.APNS_BUNDLE_ID }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          APP_ID: ${{ vars.APP_ID }}
        run: |
          deployment_name="nordlys-${GITHUB_RUN_ID}"
          # Optional host-redirect settings are only passed when set (empty = Bicep default '').
          extra_params=()
          if [ -n "$CANONICAL_HOST" ]; then extra_params+=("canonicalHost=$CANONICAL_HOST"); fi
          if [ -n "$LEGACY_HOSTS" ]; then extra_params+=("legacyHosts=$LEGACY_HOSTS"); fi
          if [ -n "$EMAIL_DOMAIN" ]; then
            extra_params+=("emailDomain=$EMAIL_DOMAIN" "emailDomainVerified=${EMAIL_VERIFIED:-false}")
            if [ -n "$EMAIL_REPLY_TO" ]; then extra_params+=("emailReplyTo=$EMAIL_REPLY_TO"); fi
          fi
          if [ -n "$APNS_KEY_ID" ]; then extra_params+=("apnsKeyId=$APNS_KEY_ID"); fi
          if [ -n "$APNS_TEAM_ID" ]; then extra_params+=("apnsTeamId=$APNS_TEAM_ID"); fi
          if [ -n "$APNS_BUNDLE_ID" ]; then extra_params+=("apnsBundleId=$APNS_BUNDLE_ID"); fi
          if [ -n "$ANDROID_CERT_SHA256" ]; then extra_params+=("androidCertSha256=$ANDROID_CERT_SHA256"); fi
          if [ -n "$APP_ID" ]; then extra_params+=("androidAppId=$APP_ID"); fi
          # Multi-line secrets (JSON, PEM) go through a parameters file so the CLI does not parse them.
          jq -n --arg fcm "$FCM_SERVICE_ACCOUNT_JSON" --arg apns "$APNS_KEY_P8" \
            '{"$schema":"https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#","contentVersion":"1.0.0.0","parameters":{"fcmServiceAccountJson":{"value":$fcm},"apnsKeyP8":{"value":$apns}}}' \
            > "$RUNNER_TEMP/push.parameters.json"
          az deployment group create \
            --name "$deployment_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters @infra/main.parameters.json \
              location="$LOCATION" \
              namePrefix="$NAME_PREFIX" \
              containerImage="${IMAGE_NAME}:${GITHUB_SHA}" \
              registryServer="ghcr.io" \
              registryUsername="${{ github.repository_owner }}" \
              registryPassword="${{ secrets.GHCR_PULL_TOKEN }}" \
              metUserAgent="${{ secrets.MET_USER_AGENT }}" \
              vapidPublicKey="${{ secrets.VAPID_PUBLIC_KEY }}" \
              vapidPrivateKey="${{ secrets.VAPID_PRIVATE_KEY }}" \
              vapidSubject="${{ secrets.VAPID_SUBJECT }}" \
              "${extra_params[@]}"
          fqdn="$(az deployment group show \
            --name "$deployment_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.outputs.containerAppFqdn.value \
            --output tsv)"
          echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/push.parameters.json"
          if [ -n "$EMAIL_DOMAIN" ]; then
            outputs="$(az deployment group show --name "$deployment_name" --resource-group "$AZURE_RESOURCE_GROUP" \
              --query properties.outputs -o json)"
            live="$(echo "$outputs" | jq -r '.emailLive.value')"
            sender="$(echo "$outputs" | jq -r '.emailSenderAddress.value')"
            {
              echo "### E-mail alerts: $sender (live: $live)"
              echo ""
              echo "DNS records for $EMAIL_DOMAIN (name relative to $EMAIL_DOMAIN; @ = $EMAIL_DOMAIN itself):"
              echo ""
              echo "| Record | Type | Name | Value | TTL |"
              echo "|---|---|---|---|---|"
              echo "$outputs" | jq -r '.emailVerificationRecords.value | to_entries[] | "| \(.key) | \(.value.type) | \(.value.name) | \(.value.value) | \(.value.ttl) |"'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$outputs" | jq -r '.emailVerificationRecords.value | to_entries[] | "::notice title=E-mail DNS \(.key)::\(.value.type) \(.value.name) -> \(.value.value) (TTL \(.value.ttl))"'
            echo "::notice title=E-mail alerts::$sender live=$live"
          fi

      - name: Output Container App FQDN
        run: |
          echo "Container App FQDN: https://${{ steps.deploy.outputs.fqdn }}"

      - name: Re-bind custom domains
        # A resource-group Bicep deploy resets ingress.customDomains, which drops
        # any manually-added custom domain (e.g. nordlys.isainative.dev). The
        # managed certificates survive at the environment level, so re-bind them
        # here. CUSTOM_DOMAIN may list several hostnames, comma-separated. A host
        # whose managed cert isn't issued yet is skipped (add it once with the
        # "Custom domain" workflow, then this keeps it bound on every deploy).
        if: vars.CUSTOM_DOMAIN != ''
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          appName="$(az containerapp list -g "$AZURE_RESOURCE_GROUP" --query "[0].name" -o tsv)"
          envName="$(az containerapp env list -g "$AZURE_RESOURCE_GROUP" --query "[0].name" -o tsv)"
          IFS=',' read -ra hosts <<< "$CUSTOM_DOMAIN"
          for raw in "${hosts[@]}"; do
            host="$(echo "$raw" | tr -d '[:space:]')"
            [ -z "$host" ] && continue
            cert="$(az containerapp env certificate list -n "$envName" -g "$AZURE_RESOURCE_GROUP" \
              --managed-certificates-only \
              --query "[?properties.subjectName=='$host'].id | [0]" -o tsv)"
            if [ -z "$cert" ]; then
              echo "No managed certificate for $host yet - skipping re-bind."
              continue
            fi
            az containerapp hostname bind -n "$appName" -g "$AZURE_RESOURCE_GROUP" \
              --hostname "$host" --environment "$envName" --certificate "$cert"
            echo "Re-bound https://$host"
          done
