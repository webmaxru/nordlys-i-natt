name: CI

on:
  pull_request:
  push:

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @nordlys/shared build

      - name: Typecheck workspace
        run: pnpm -r typecheck

      - name: Test shared and API packages
        run: pnpm --filter @nordlys/shared --filter @nordlys/api test

      - name: Build web app
        run: pnpm --filter @nordlys/web build

      - name: Install Playwright browser
        run: pnpm --filter @nordlys/web exec playwright install --with-deps chromium

      - name: Visual / layout E2E tests
        run: pnpm --filter @nordlys/web test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Lint
        run: pnpm lint
        continue-on-error: true
